[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-blog"
version = "0.1.0"
description = "Generate blog post drafts with Gemini"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "google-genai>=1.0.0",
  "python-dotenv>=1.0.1",
]

[project.scripts]
autoblog = "auto_blog.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
