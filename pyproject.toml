[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-blog"
version = "0.1.0"
description = "Generate blog post drafts with Gemini"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "google-genai>=1.0.0",
  "google-auth>=2.35.0",
  "jinja2>=3.1.4",
  "langgraph>=0.2.0",
  "markdown>=3.6",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.9",
  "uvicorn>=0.30.0",
]

[project.scripts]
autoblog = "auto_blog.cli:main"
autoblog-web = "auto_blog.web:run"

[tool.setuptools.packages.find]
include = ["auto_blog*"]

[tool.setuptools.package-data]
auto_blog = ["prompt_presets/*.md", "templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
